<!DOCTYPE html>
<html>
<head>
    <title>Education Details</title>
    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px auto;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #333;
            text-align: center;
            padding: 10px;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        h2 {
            text-align: center;
            font-family: Arial, sans-serif;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>My Education Details</h2>

    <table>
        <tr>
            <th>Qualification / Degree</th>
            <th>Institution / School</th>
            <th>Passing Year</th>
            <th>Percentage / CGPA</th>
        </tr>
        <tr>
            <td>B.Tech (Computer Science & AI/ML)</td>
            <td>University College</td>
            <td>Pursuing</td>
            <td>-</td>
        </tr>
        <tr>
            <td>12th (Senior Secondary)</td>
            <td>School Name</td>
            <td>2025</td>
            <td>--%</td>
        </tr>
        <tr>
            <td>10th (Secondary)</td>
            <td>School Name</td>
            <td>2023</td>
            <td>--%</td>
        </tr>
    </table>

</body>
</html>
